      <stop offset="0" stop-color="#65306a"/>
      <stop offset="0.48" stop-color="#24132f"/>
      <stop offset="1" stop-color="#0d0814"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
