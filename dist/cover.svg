<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cauldron Rush</title>
  <desc id="desc">A glowing alchemy cauldron surrounded by colorful game chips on a deep purple background.</desc>
  <defs>
